name: Build and publish thesis

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thesis-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compile thesis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LaTeX and bibliography tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-full \
            biber

      - name: Compile using build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh
          test -s Masterarbeit/main.pdf

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v7
        with:
          name: master-thesis
          path: Masterarbeit/main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -r website/* _site/
          cp Masterarbeit/main.pdf _site/thesis.pdf

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5