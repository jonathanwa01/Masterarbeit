name: Build and publish thesis

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thesis-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compile thesis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LaTeX and bibliography tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-full \
            biber

      - name: Compile using build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh
          test -s Masterarbeit/main.pdf

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v7
        with:
          name: master-thesis
          path: Masterarbeit/main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp Masterarbeit/main.pdf _site/thesis.pdf

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Jonathan Wassermann · Master's Thesis</title>
            <style>
              :root {
                color-scheme: light dark;
                font-family: system-ui, sans-serif;
              }

              body {
                max-width: 760px;
                margin: 12vh auto;
                padding: 0 24px;
                line-height: 1.7;
              }

              .eyebrow {
                color: #777;
                font-size: .85rem;
                letter-spacing: .12em;
                text-transform: uppercase;
              }

              h1 {
                font-size: clamp(2rem, 6vw, 3.4rem);
                line-height: 1.15;
              }

              a { color: #477de9; }

              .button {
                display: inline-block;
                margin-top: 1rem;
                padding: .75rem 1.2rem;
                border-radius: 8px;
                background: #285bd4;
                color: white;
                text-decoration: none;
              }

              footer {
                margin-top: 4rem;
                font-size: .9rem;
                color: #777;
              }
            </style>
          </head>
          <body>
            <main>
              <p class="eyebrow">Jonathan Wassermann · Mathematics</p>
              <h1>The Keel–Mori Theorem</h1>
              <p>
                Master's thesis on algebraic stacks, coarse moduli spaces,
                and the local-to-global construction of quotients.
              </p>
              <p>
                This is a working draft, automatically compiled from the
                current development branch.
              </p>
              <a class="button" href="./thesis.pdf">Read the thesis PDF</a>
            </main>
            <footer>
              <a href="https://github.com/jonathanwa01">GitHub profile</a>
            </footer>
          </body>
          </html>
          HTML

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4