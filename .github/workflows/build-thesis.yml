name: Build thesis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: thesis-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile thesis
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LaTeX and bibliography tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-full \
            biber

      - name: Compile using build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh
          test -s Masterarbeit/main.pdf

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v7
        with:
          name: master-thesis
          path: Masterarbeit/main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Prepare PDF release asset
        run: cp Masterarbeit/main.pdf thesis.pdf

      - name: Publish PDF release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-latest
          name: Thesis PDF
          files: thesis.pdf
          overwrite_files: true
          generate_release_notes: true